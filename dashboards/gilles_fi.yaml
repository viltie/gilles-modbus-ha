  # ------------------------------------------------------------------ Käyttötilastot
  - title: Käyttötilastot
    path: tilastot
    icon: mdi:chart-line
    cards:
      - type: markdown
        content: >-
          ## Havaittu käyttö


          Käynnistys- ja signaalilaskurit laskevat suoraan havaitut muutokset käyttöönotosta lähtien.
          Mittauskatkoja ei täydennetä.


          **Käynnistykset 24 h:** lasketaan viimeisen 24 tunnin aikana tallennetut suorat vaihemuutokset
          valmiustilasta (0) esituuletukseen (1). Päivittyy noin 30 sekunnin välein. Uudelleenkäynnistykset
          ja yhteyden palautumiset ilman havaittua siirtymää eivät ole käynnistyksiä. Päivälaskuri kirjaa
          käynnistyksen aloituspäivälle, vaikka jakso jatkuisi yli keskiyön.


          REG78-laskurit laskevat REG78:n nousevia reunoja; todellista tuhkanpoistoa ne eivät vahvista.
          Kaikkien vaiheiden O₂-minimi sisältää valmiustilan arvot. Polttoaineen kulutus ja hyötysuhde
          jäävät tuntemattomiksi ilman omaa mittausta.
      - type: entities
        title: Datan laatu · viimeiset 24 h
        show_header_toggle: false
        entities:
          - entity: binary_sensor.gilles_messdaten_verfuegbar
            name: 40 mittausarvoa numeerisina
          - entity: sensor.gilles_phasendaten_abdeckung_24h
            name: Aika tunnetulla vaihekoodilla
          - entity: sensor.gilles_phasendaten_luecken_24h
            name: Havaitut katkot
      - type: entities
        title: Käynnistykset · suoraan havaitut
        show_header_toggle: false
        entities:
          - entity: sensor.gilles_brennstarts_heute
            name: Tänään
          - entity: sensor.gilles_brennstarts_woche
            name: Tällä viikolla
          - entity: sensor.gilles_brennstarts_monat
            name: Tässä kuussa
          - entity: sensor.gilles_brennstarts_erfasst
            name: Yhteensä käyttöönotosta
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.gilles_brennstart_letzter
            state: [unknown, unavailable]
        card:
          type: markdown
          content: >-
            **Käynnistystä ei ole vielä havaittu.** Ajankohta näkyy seuraavan havaitun siirtymän jälkeen
            valmiustilasta esituuletukseen.
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.gilles_brennstart_letzter
            state_not: [unknown, unavailable]
        card:
          type: entities
          title: Viimeisin havaittu käynnistys
          show_header_toggle: false
          entities:
            - entity: sensor.gilles_brennstart_letzter
              name: Ajankohta
            - entity: sensor.gilles_zeit_seit_brennstart
              name: Aikaa siitä
      - type: entities
        title: Käyttöajat · tunnetut vaiheet
        show_header_toggle: false
        entities:
          - entity: sensor.gilles_brennzeit_heute
            name: Polttojakso tänään
          - entity: sensor.gilles_brennzeit_7d
            name: Polttojakso · 7 päivää
          - entity: sensor.gilles_heizphase_dauer_7d
            name: Lämmitysvaihe · 7 päivää
          - entity: sensor.gilles_zuendphase_dauer_7d
            name: Sytytysvaiheet · 7 päivää
      - type: markdown
        content: >-
          Polttojakson aika sisältää esituuletuksen, sytytyksen, lämmityksen, loppuunpolton, jälkikäynnin
          ja havaitun koodin 10, jonka toiminta on vielä selvittämättä. Se ei todista jatkuvaa liekkiä.
          Kattavuus huomioi vain tähän asti havaitut vaihekoodit; muut tuntemattomat koodit ja puuttuvat
          arvot on tarkistettava erikseen. 100 %:iin pyöristetty arvo ei sulje pois lyhyitä katkoja.
      - type: entities
        title: Mittausalue · viimeiset 24 h
        show_header_toggle: false
        entities:
          - entity: sensor.gilles_kessel_24h_min
            name: Kattila · minimi
          - entity: sensor.gilles_kessel_24h_max
            name: Kattila · maksimi
          - entity: sensor.gilles_abgas_24h_max
            name: Savukaasu · maksimi
          - entity: sensor.gilles_o2_24h_min
            name: O₂ · minimi
      - type: entities
        title: REG78-signaali ja luukku
        show_header_toggle: false
        entities:
          - entity: sensor.gilles_ascheaustragungen_heute
            name: REG78-reunat tänään
          - entity: sensor.gilles_ascheaustragungen_erfasst
            name: REG78-reunat käyttöönotosta
          - entity: sensor.gilles_tuer_offen_heute_dauer
            name: Luukku auki tänään · epäsuora
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.gilles_ascheaustragung_letzte
            state: [unknown, unavailable]
        card:
          type: markdown
          content: >-
            **REG78:n nousevaa reunaa ei ole vielä havaittu.** Ajankohta näkyy seuraavan havaitun
            muutoksen 0→1 jälkeen.
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.gilles_ascheaustragung_letzte
            state_not: [unknown, unavailable]
        card:
          type: entities
          title: Viimeisin REG78:n nouseva reuna
          show_header_toggle: false
          entities:
            - entity: sensor.gilles_ascheaustragung_letzte
              name: Ajankohta
            - entity: sensor.gilles_zeit_seit_aschenaustragung
              name: Aikaa siitä
      - type: entities
        title: Käynnistyksen diagnostiikka
        show_header_toggle: false
        entities:
          - entity: sensor.gilles_brennstarts_24h
            name: Käynnistykset 24 h
          - entity: binary_sensor.gilles_haeufige_brennstarts
            name: Tiheät käynnistykset
          - entity: sensor.gilles_startphase_minuten
            name: Käynnistysvaihe (min)
          - entity: binary_sensor.gilles_startphase_zu_lang
            name: Käynnistysvaihe liian pitkä
          - entity: sensor.gilles_kesseltemperatur_trend_10min
            name: Lämpötilan nousu · 10 min keskiarvo
          - entity: binary_sensor.gilles_temperaturanstieg_fehlt
            name: Lämpötila ei nouse
          - entity: binary_sensor.gilles_messwerte_unplausibel
            name: Epäuskottavat mittausarvot
      - type: entities
        title: Säädettävät hälytysrajat
        show_header_toggle: false
        entities:
          - entity: input_number.gilles_brennstarts_warnschwelle
            name: Käynnistyksiä 24 h, raja
          - entity: input_number.gilles_zuenddauer_warnschwelle
            name: Sytytyksen kesto, raja (min)
          - entity: input_number.gilles_temperaturanstieg_mindestwert
            name: Lämpötilan vähimmäisnousu (°C)
      - type: markdown
        content: >-
          Käynnistysdiagnostiikka koskee vain suoraan havaittuja käynnistyksiä 0→1, kun kaikki 40
          raaka-arvoa ovat numeerisina saatavilla. Uudelleenkäynnistys, valmiustila tai yhden raaka-arvon
          puuttuminen hylkää käynnissä olevan diagnoosin. Datan palautuminen ei riitä; vasta uusi
          käynnistys aktivoi sen.


          Käynnistysvaihe sisältää esituuletuksen. Kun syttymis- tai lämmitysvaihetta on kestänyt 30
          minuuttia, lämpötilahuomautus näkyy vain, jos sekä nousu lähtöarvosta jää asetetun rajan alle
          että kymmenen minuutin aikana tasoitettu lämpenemisnopeus jää alle rajan / 30 minuuttia. Näin
          diagnoosi huomioi lämpimät käynnistykset, joissa kattila ensin hieman jäähtyy. Se tarkistaa
          käynnistyksen eikä todista palamista tai lämmitystehoa.


          ”40 mittausarvoa numeerisina” tarkistaa, että lukuarvot ovat olemassa, ei viimeisimmän
          onnistuneen Modbus-luvun ikää. Normaalien polttojaksojen aikana rekisteriarvot kirjataan
          lokikirjaan viiden minuutin välein ja vaihemuutoksissa myöhempää Touch-vertailua varten.

  # ------------------------------------------------------------------ Rekisterit
  - title: Rekisterit
    path: rekisterit
    icon: mdi:magnify
    cards:
      - type: markdown
        content: >-
          ## Rekisterihavainnot ja avoimet kysymykset


          **REG70 = polttoainevaraston lämpötila ×0,1 °C** – vahvistettu Touch-paneelista
          (159 ↔ 16 °C). Sensori: *Polttoainevaraston lämpötila*.


          **REG46 = 61 = ”Varaajan lämpötila saavutettu”** – vahvistettu Touch-paneelin otsikosta.


          **Vaihe 10 / tila 43:** uusia koodeja, merkitys avoin. Vaihe 10 seuraa sammutuksessa vaihetta 9
          ja siirtyy vaiheeseen 0. Tila 43 säilyy myös valmiustilassa; se ei ole vahvistettu vikailmoitus.


          **REG56:** O₂-asetusarvon hypoteesi; vertailu Touch-paneelin ”Jäännöshappi – asetus” -arvoon
          polttimen käydessä puuttuu.


          **REG68:** ehdokas ”nykyiselle syöttömäärälle”, ei kulutuslaskuri. Skaalaus auki.


          **REG72:** aktiivinen sytytyksen aikana. **REG76:** pulsseja myös valmiustilassa.


          **REG78:** hypoteesina pumppu/vapautus; fyysinen lähtö vahvistamatta, laskurit laskevat vain reunoja.


          **Varaajan ylä- ja alalämpötila** eivät ole Modbusissa (holding-rekisterit 0–93 tarkistettu).
      - type: history-graph
        title: REG56 · O₂-asetusarvoehdokas (raaka-arvo)
        hours_to_show: 24
        entities:
          - entity: sensor.gilles_reg56
            name: REG56
      - type: history-graph
        title: REG68 · syöttömääräehdokas (raaka-arvo)
        hours_to_show: 24
        entities:
          - entity: sensor.gilles_zaehler
            name: REG68
      - type: history-graph
        title: REG72 · liittyy sytytykseen (oletettu)
        hours_to_show: 24
        entities:
          - entity: sensor.gilles_binarflag
            name: REG72
      - type: history-graph
        title: REG74 · tähän asti 0; REG76 · pulssit
        hours_to_show: 24
        entities:
          - entity: sensor.gilles_reg74
            name: REG74
          - entity: sensor.gilles_reg76
            name: REG76
      - type: history-graph
        title: Vaihe- ja tilakoodit vertailuun
        hours_to_show: 24
        entities:
          - entity: sensor.gilles_brenn_phase_code
            name: Polttovaihe
          - entity: sensor.gilles_boiler_status_code
            name: Kattilan tila
          - entity: sensor.gilles_status_bitmap
            name: Laitteiston tila

