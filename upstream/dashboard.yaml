  - content: "Die Startdiagnose gilt nur für direkt beobachtete Starts von 0 auf 1 bei 40 numerisch verfügbaren Rohwerten. Neustart, Standby oder Ausfall eines Rohwerts verwerfen die laufende Diagnose. Wiederkehr der Daten genügt nicht; erst ein neuer Start aktiviert sie.\n\nDie Startphase schließt Vorlüften ein. Ab 30 Minuten im Anbrenn- oder Heizbetrieb erscheint der Temperaturhinweis nur, wenn sowohl der Anstieg gegenüber dem Startwert unter der eingestellten Schwelle liegt als auch die über zehn Minuten geglättete Heizrate unter Schwelle / 30 Minuten liegt. Dadurch berücksichtigt die Diagnose bereits warme Starts mit anfänglicher Abkühlung. Sie prüft den Start und ist kein Nachweis der Verbrennung oder der Heizleistung.\n\n„40 Messwerte numerisch vorhanden“ prüft vorhandene Zahlenwerte, nicht das Alter der letzten erfolgreichen Modbus-Abfrage. Während regulärer Brennläufe erscheinen alle fünf Minuten und bei Phasenwechseln Registerstände im Aktivitätenprotokoll für den späteren Touch-Abgleich."
    type: markdown
