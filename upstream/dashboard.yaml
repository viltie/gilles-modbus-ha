  - content: '## Drehzahlen & Verbrennung


      Die Skalierung von REG58/60/62 bleibt bis zum synchronisierten Touch-Vergleich offen. Bei Primärluft
      und Saugzug besteht eine Faktor-10-Frage; ein Nullwert kann keinen Skalierungsfaktor bestätigen.
      O₂-Werte im Standby sind kein Nachweis der Verbrennungsqualität.'
