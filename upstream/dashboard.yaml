- cards:
  - content: "## Erfasster Betrieb\n\nStart- und Signalzähler erfassen direkt beobachtete Wechsel seit ihrer Einrichtung. Messlücken werden nicht aufgefüllt.\n\n**Brennstarts 24 h:** Gezählt werden die in den letzten 24 Stunden aufgezeichneten direkten Phasenwechsel von Standby (0) zu Vorlüften (1). Aktualisierung etwa alle 30 Sekunden. Neustarts und Wiederverbindungen ohne beobachteten Übergang zählen nicht als Start. Tageszähler ordnen einen Start dem Starttag zu, auch wenn der Zyklus über Mitternacht läuft.\n\nDie bisherigen Aschezähler zählen REG78-Einschaltflanken; eine tatsächliche Ascheaustragung ist damit nicht bestätigt. O₂-Minima über alle Phasen enthalten Standbywerte. Pelletverbrauch und Wirkungsgrad bleiben ohne eigene Messung unbekannt."
    type: markdown
  - entities:
    - entity: binary_sensor.gilles_messdaten_verfuegbar
      name: "40 Messwerte numerisch vorhanden"
    - entity: sensor.gilles_phasendaten_abdeckung_24h
      name: Zeit mit bekanntem Phasencode
    - entity: sensor.gilles_phasendaten_luecken_24h
      name: Erfasste Nichtverfügbarkeitsintervalle
