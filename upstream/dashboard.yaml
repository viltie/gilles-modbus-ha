  - content: Die Brennzyklus-Zeit umfasst Vorbelüftung, Zünden, Heizen, Ausbrennen, Nachlauf und den beobachteten
      Code 10 mit noch ungeklärter Funktion. Sie belegt keine durchgehende Flamme. Die Abdeckung berücksichtigt
