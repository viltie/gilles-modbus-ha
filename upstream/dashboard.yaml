- cards:
  - content: '## Register-Erkenntnisse und offene Fragen


      **Phase 10 / Status 43:** neu beobachtete Codes, Bedeutung offen. Phase 10 folgt in einem aufgezeichneten
      Abschaltpfad auf 9 und geht in 0 über. Status 43 bleibt auch im Standby bestehen; daraus folgt keine
      bestätigte Störungsmeldung.


      **REG56:** O₂-Sollwert-Hypothese durch einen weiteren Heizverlauf gestützt. Vergleich mit „Restsauerstoff
      – Soll“ bei laufendem Brenner fehlt.


      **REG68:** Kandidat für „aktuelle Einschubmenge“, kein Verbrauchszähler. Skala weiterhin offen.


      **REG72:** erneut während Zündung aktiv. **REG76:** Pulse auch im Standby, kein belegter Reinigungsrhythmus.


      **REG78:** Aktivintervalle mit steigendem Rücklauf und sinkender Kesseltemperatur stützen Pumpe/Freigabe
      als Hypothese. Physischer Ausgang unbestätigt; Zähler erfassen nur Flanken.


      REG70/74 bisher nur null. Luftskalierungen unverändert. REG46=61 passt vorläufig zu „Puffertemperatur
      erreicht“.'
    type: markdown
