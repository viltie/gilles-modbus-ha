# Native counter and diagnostic automations. No boiler registers are written.
- actions:
  - action: counter.increment
    target:
      entity_id: counter.gilles_brennstarts_gesamt
  alias: Gilles Brennstarts erfassen
  conditions:
  - condition: trigger
    id: observed_transition
  description: Erfasst seit 07.09.2026 direkt beobachtete Übergänge von Standby (0) zu Vorbelüftung (1).
    Lücken oder Wiederverbindungen werden nicht als Start gezählt.
  max: 5
  mode: queued
  triggers:
  - entity_id: sensor.gilles_brenn_phase_code
    from: '0'
    id: observed_transition
    to: '1'
    trigger: state
- alias: Gilles Ascheaustragungen erfassen
  description: Erfasst direkt beobachtete REG78-Wechsel von 0 zu 1. Zuordnung zur Ascheaustragung ungesichert;
    kein Nachweis einer Motorlaufzeit oder abgeschlossenen Austragung. Lücken und Wiederverbindungen zählen
    nicht.
  triggers:
  - entity_id: sensor.gilles_ascheaustragung_aktiv
    from: '0'
    id: observed_transition
    to: '1'
    trigger: state
  conditions:
  - condition: trigger
    id: observed_transition
  actions:
  - action: counter.increment
    target:
      entity_id: counter.gilles_ascheaustragungen_gesamt
  max: 5
  mode: queued
- alias: Gilles Brennstart Diagnosebasis
  description: Speichert nur direkt beobachtete Übergänge 0→1 bei 40 numerisch verfügbaren Rohwerten und
    die Kesseltemperatur. Bei Neustart, Standby, fehlendem Phasencode oder Ausfall/ungültigem Wert eines
    der 40 Rohsensoren wird die laufende Diagnose verworfen. Wiederkehr der Daten aktiviert sie nicht;
    erst der nächste gültige Start. Keine Kesselsteuerung.
  triggers:
  - entity_id: sensor.gilles_brenn_phase_code
    from: '0'
    id: start
    to: '1'
    trigger: state
  - entity_id: sensor.gilles_brenn_phase_code
    id: reset
    to:
    - '0'
    - unavailable
    - unknown
    trigger: state
  - trigger: state
    entity_id: binary_sensor.gilles_messdaten_verfuegbar
    to:
    - 'off'
    - unknown
    - unavailable
    id: reset
  - event: start
    id: reset
    trigger: homeassistant
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      - condition: state
        entity_id: binary_sensor.gilles_messdaten_verfuegbar
        state: 'on'
      sequence:
      - action: input_datetime.set_datetime
        data:
          timestamp: '{{ as_timestamp(now()) }}'
        target:
          entity_id: input_datetime.gilles_letzter_brennstart
      - action: input_number.set_value
        data:
          value: '{{ states(''sensor.gilles_kesseltemperatur'') | float }}'
        target:
          entity_id: input_number.gilles_kesseltemperatur_bei_brennstart
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.gilles_brennstart_beobachtet
    default:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.gilles_brennstart_beobachtet
  max: 5
  mode: queued
- alias: Gilles Registerbeobachtung im Brennbetrieb
  description: Protokolliert während regulärer Brennläufe alle fünf Minuten und bei Phasenwechseln die
    zuletzt ausgelesenen, asynchron abgefragten Registerwerte. Enthält Modus, Status, Sollwert, Rücklauf
    und REG78 für den Touch-Abgleich. Keine Kesselsteuerung. Code 10 wird als beobachteter Zykluszustand
    mit ungeklaerter Funktion mitprotokolliert.
  triggers:
  - entity_id: sensor.gilles_brenn_phase_code
    to:
    - '1'
    - '3'
    - '5'
    - '6'
    - '7'
    - '8'
    - '9'
    - '10'
    trigger: state
  - minutes: /5
    trigger: time_pattern
  conditions:
  - condition: state
    entity_id: sensor.gilles_brenn_phase_code
    state:
    - '1'
    - '3'
    - '5'
    - '6'
    - '7'
    - '8'
    - '9'
    - '10'
  - condition: state
    entity_id: binary_sensor.gilles_messdaten_verfuegbar
    state: 'on'
  actions:
  - action: logbook.log
    data:
      entity_id: sensor.gilles_brenn_phase_code
      message: Phase={{ states('sensor.gilles_brenn_phase_code') }}; Kessel={{ states('sensor.gilles_kesseltemperatur')
        }}; Abgas={{ states('sensor.gilles_abgastemperatur') }}; O2={{ states('sensor.gilles_o2_ist')
        }}; REG56={{ states('sensor.gilles_reg56') }}; Primaer={{ states('sensor.gilles_primar_ist_vermutet')
        }}; Sekundaer={{ states('sensor.gilles_sekundar_ist_vermutet') }}; Saugzug={{ states('sensor.gilles_saugzug_ist_vermutet')
        }}; AbgasSoll={{ states('sensor.gilles_abgas_soll_live_vermutet') }}; REG68={{ states('sensor.gilles_zaehler')
        }}; REG70={{ states('sensor.gilles_reg70') }}; REG72={{ states('sensor.gilles_binarflag') }};
        REG74={{ states('sensor.gilles_reg74') }}; REG76={{ states('sensor.gilles_reg76') }}; Modus={{
        states('sensor.gilles_boiler_status_code') }}; REG46={{ states('sensor.gilles_status_bitmap')
        }}; KesselSoll={{ states('sensor.gilles_kessel_soll_live') }}; Ruecklauf={{ states('sensor.gilles_rucklauftemperatur')
        }}; REG78={{ states('sensor.gilles_ascheaustragung_aktiv') }}; Abfrage=asynchron
      name: Gilles Registerabgleich
  max: 5
  mode: queued

