# Gilles alerts to a WhatsApp group through a WAHA bridge (https://waha.devlike.pro). Nothing here writes to the boiler.
# Needs packages/gilles_halytykset.yaml, which holds the alert automations and calls script.gilles_whatsapp_viesti.
# Needs in secrets.yaml: gilles_whatsapp_url, gilles_whatsapp_api_key, gilles_whatsapp_group, gilles_whatsapp_webhook
# (see secrets.example.yaml in the repo root and docs/WHATSAPP.md).
rest_command:
  gilles_whatsapp:
    url: !secret gilles_whatsapp_url
    method: POST
    headers:
      X-Api-Key: !secret gilles_whatsapp_api_key
    content_type: application/json
    payload: "{{ {'session': 'default', 'chatId': chat_id, 'text': message} | to_json }}"
    timeout: 20

script:
  gilles_whatsapp_viesti:
    alias: Gilles WhatsApp-viesti
    description: Sends to the group. The bridge can lose its session, so a failed send falls back to the phone.
    mode: queued
    max: 5
    fields:
      message:
        description: Message text
    sequence:
      - action: rest_command.gilles_whatsapp
        data:
          chat_id: !secret gilles_whatsapp_group
          message: "{{ message }}"
        response_variable: vastaus
        continue_on_error: true
      - if:
          - condition: template
            value_template: "{{ vastaus is not defined or vastaus.status | default(0) not in [200, 201] }}"
        then:
          - action: script.gilles_varailmoitus
            data:
              title: WhatsApp-lähetys epäonnistui
              message: "{{ message }}"

automation:
  # WAHA has no per-chat webhook filter, so every message of the linked account arrives here.
  # stored_traces: 0 keeps other chats out of the saved traces.
  - alias: Gilles WhatsApp tila-komento
    id: gilles_whatsapp_tila
    description: Answers !tila in the group with the boiler status. Read only.
    mode: single
    max_exceeded: silent
    trace:
      stored_traces: 0
    variables:
      ryhma: !secret gilles_whatsapp_group
    triggers:
      - trigger: webhook
        webhook_id: !secret gilles_whatsapp_webhook
        allowed_methods:
          - POST
        local_only: true
    conditions:
      - condition: template
        value_template: >-
          {% set p = trigger.json.payload | default({}) %}
          {{ trigger.json.event | default('') == 'message.any'
             and ryhma in [p.from | default(''), p.to | default('')]
             and (p.body | default('', true) | string | trim | lower) == '!tila' }}
      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none
             or now() - this.attributes.last_triggered > timedelta(seconds=30) }}
    actions:
      - action: script.gilles_tilaviesti
        response_variable: tila
      - action: script.gilles_whatsapp_viesti
        data:
          message: "{{ tila.teksti }}"
