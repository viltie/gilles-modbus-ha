template:
- sensor:
  - name: Gilles Brenn Phase
    unique_id: gilles_brenn_phase_text
    state: "{% set codes = {\n  0: 'Standby',\n  1: 'Vorlueften',\n  3: 'Zuendung',\n  5: 'Zuendung-Spaet',\n\
      \  6: 'Anbrennphase',\n  7: 'Heizen regeln',\n  8: 'Ausbrennen',\n  9: 'Auskuehlen',\n  10: 'Code\
      \ 10 (Funktion ungeklaert)'\n} %} {{ codes.get(states('sensor.gilles_brenn_phase_code') | int(0),\n\
      \   'Unbekannt (Code ' ~ states('sensor.gilles_brenn_phase_code') ~ ')') }}\n"
    icon: '{% set p = states(''sensor.gilles_brenn_phase_code'') | int(0) %} {% if p == 0 %}mdi:power-standby
      {% elif p in [1,3,5,6] %}mdi:fire {% elif p == 7 %}mdi:fire {% elif p == 8 %}mdi:fire-alert {% elif
      p == 9 %}mdi:snowflake-melt {% else %}mdi:help-circle {% endif %}

      '
    availability: '{{ is_number(states(''sensor.gilles_brenn_phase_code'')) }}'
  - name: Gilles Boiler Status
    unique_id: gilles_boiler_status_text
    state: "{% set codes = {\n  1: 'Handbetrieb',\n  3: 'Puffer/Boiler',\n  5: 'Automatik'\n} %} {{ codes.get(states('sensor.gilles_boiler_status_code')\
      \ | int(0),\n   'Unbekannt (Code ' ~ states('sensor.gilles_boiler_status_code') ~ ')') }}\n"
    icon: '{% set s = states(''sensor.gilles_boiler_status_code'') | int(0) %} {% if s == 1 %}mdi:hand-back-right
      {% elif s == 3 %}mdi:water-boiler {% elif s == 5 %}mdi:cog {% else %}mdi:state-machine {% endif
      %}

      '
    availability: '{{ is_number(states(''sensor.gilles_boiler_status_code'')) }}'
  - name: Gilles Anlagen-Zustand
    unique_id: gilles_anlagen_zustand
    state: "{% set codes = {\n  0: 'Normal',\n  35: 'Brennraumtuer offen',\n  43: 'Code 43 (Bedeutung\
      \ offen)',\n  61: 'Code 61 (Puffertemperatur erreicht?)'\n} %} {{ codes.get(states('sensor.gilles_status_bitmap')\
      \ | int(0),\n   'Code ' ~ states('sensor.gilles_status_bitmap')) }}\n"
    icon: mdi:alert-circle-outline
    availability: '{{ is_number(states(''sensor.gilles_status_bitmap'')) }}'
  - name: Gilles Zeitprofil
    unique_id: gilles_zeitprofil
    state: '{% set live = states(''sensor.gilles_kessel_soll_live'') | float(0) %}

      {% set tag = states(''sensor.gilles_kessel_soll_tag'') | float(0) %}

      {% set nacht = states(''sensor.gilles_kessel_soll_nacht'') | float(0) %}

      {% if live == 0 %}inaktiv

      {% elif is_state(''sensor.gilles_boiler_status_code'', ''3'') %}Puffer-Lade-Soll

      {% elif live == tag and live == nacht %}Tag/Nacht identisch

      {% elif live == tag %}Tag

      {% elif live == nacht %}Nacht

      {% else %}Sonderwert ({{ live }} °C)

      {% endif %}'
    icon: '{% set p = states(''sensor.gilles_zeitprofil'') %} {% if p == ''Tag'' %}mdi:weather-sunny {%
      elif p == ''Nacht'' %}mdi:weather-night {% elif p == ''Puffer-Lade-Soll'' %}mdi:water-boiler {%
      else %}mdi:help-circle {% endif %}

      '
    availability: '{{ is_number(states(''sensor.gilles_kessel_soll_live'')) and is_number(states(''sensor.gilles_kessel_soll_tag''))
      and is_number(states(''sensor.gilles_kessel_soll_nacht'')) and is_number(states(''sensor.gilles_boiler_status_code''))
      }}'
- binary_sensor:
  - name: Gilles Brennraumtuer
    unique_id: gilles_brennraumtuer
    state: '{{ states(''sensor.gilles_status_bitmap'') | int(0) == 35 }}'
    device_class: door
    icon: mdi:door
    availability: '{{ states(''sensor.gilles_status_bitmap'') in [''0'', ''35'', ''61''] }}'
    attributes:
      erkennung: Indirekt aus REG46; andere als bekannte Statuscodes bleiben unbekannt
  - name: Gilles Ascheaustragung laeuft
    unique_id: gilles_ascheaustragung_laeuft
    state: '{{ states(''sensor.gilles_ascheaustragung_aktiv'') | int(0) > 0 }}'
    icon: mdi:trash-can-outline
    availability: '{{ states(''sensor.gilles_ascheaustragung_aktiv'') in [''0'', ''1''] }}'
  - name: Gilles Brennzyklus aktiv
    unique_id: gilles_brenner_aktiv
    state: '{{ states(''sensor.gilles_brenn_phase_code'') | int(0) > 0 }}'
    device_class: heat
    icon: mdi:fire
    availability: '{{ states(''sensor.gilles_brenn_phase_code'') in [''0'', ''1'', ''3'', ''5'', ''6'',
      ''7'', ''8'', ''9'', ''10''] }}'
    attributes:
      bedeutung: Beobachteter Brennzyklus einschliesslich Vorlueften, Nachlauf und Code 10 mit ungeklaerter
        Funktion; kein Flammennachweis
