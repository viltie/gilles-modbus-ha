# Gilles Touch -- Home Assistant, live-verified configuration (2026-09-07).
# Set host to your boiler IP; 192.0.2.1 is a documentation placeholder.
# Keep existing unique_id/entity_id values; see entity_ids.json and README.md.
# REG42 polls every 2 s to keep the measured ~3 s TCP idle timeout from expiring.
# HA 2026.9.1 logs a generic warning for polling below 5 s; only REG42 uses 2 s.
# message_wait_milliseconds separates requests. HA sets PyModbus retries internally.
# Runtime scales and identities preserved. REG56 is an O2-target candidate; REG68 is not a cumulative counter.
# REG58/60/62 scales and REG78 physical meaning remain unresolved; see REGISTER_FINDINGS.md.
modbus:
  - name: gilles
    type: tcp
    host: 192.0.2.1              # CHANGE TO YOUR BOILER IP (RFC5737 placeholder)
    port: 502
    delay: 2
    timeout: 5
    message_wait_milliseconds: 200

    sensors:
      # === Setpoints / Parameters (rarely changed, slow polling) ===

      - name: "Gilles Foerderschnecke Soll"
        unique_id: gilles_foerderschnecke_soll
        slave: 1
        address: 0
        input_type: holding
        data_type: int32
        scale: 0.1
        precision: 1
        unit_of_measurement: "%"
        scan_interval: 300

      - name: "Gilles Primaer Max"
        unique_id: gilles_primaer_max
        slave: 1
        address: 2
        input_type: holding
        data_type: int32
